<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Agent Platform</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">🤖</div>
        <div class="brand-text">
          <h1>Multi-Agent</h1>
          <span>RAG + MCP · LangGraph</span>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-new-session">＋ 新建会话</button>

      <!-- 会话列表 -->
      <div class="section" data-collapsible="sessions">
        <div class="section-title">
          <span class="sec-toggle"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></span> 会话
          <span class="session-title-actions">
            <button class="btn btn-xs" id="btn-batch-mode" title="多选删除会话">多选</button>
            <span class="batch-bar" id="batch-bar" hidden>
              <button class="btn btn-xs" id="btn-batch-all" title="全选/取消全选">全选</button>
              <button class="btn btn-xs btn-danger" id="btn-batch-del" title="删除选中会话" disabled>
                删除<span id="batch-count"></span>
              </button>
            </span>
          </span>
        </div>
        <div class="section-body">
          <div class="session-list" id="session-list"></div>
        </div>
      </div>

      <!-- 文档管理 -->
      <div class="section" data-collapsible="docs">
        <div class="section-title"><span class="sec-toggle"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></span> 知识库文档 <small id="doc-count"></small></div>
        <div class="section-body">
          <div class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" multiple hidden
                   accept=".txt,.md,.pdf,.docx,.html" />
            <p>点击上传文档<br /><small>txt / md / pdf / docx / html</small></p>
          </div>
          <div class="doc-list" id="doc-list"></div>
        </div>
      </div>

      <!-- 长期记忆 -->
      <div class="section" data-collapsible="memory">
        <div class="section-title"><span class="sec-toggle"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5L8 10l3.5-3.5"/></svg></span> 长期记忆 <small id="memory-count"></small></div>
        <div class="section-body">
          <div class="memory-search">
            <input type="text" id="memory-search" placeholder="🔍 语义搜索记忆…" />
          </div>
          <div class="memory-add">
            <input type="text" id="memory-input" placeholder="记住：例如 我喜欢Python…" />
            <button class="btn" id="btn-add-memory">记</button>
          </div>
          <div class="memory-list" id="memory-list"></div>
        </div>
      </div>

      <!-- 状态 -->
      <div class="status-bar">
        <span class="dot" id="health-dot"></span>
        <span id="health-text">检查中…</span>
        <span class="status-spacer"></span>
        <button class="btn btn-xs" id="btn-login" title="登录 / 注册">登录</button>
        <div class="user-menu-wrap">
          <span class="user-chip" id="user-chip" hidden title="账户菜单"></span>
          <div class="user-menu" id="user-menu" hidden>
            <div class="user-menu-head">
              <div class="user-menu-avatar">👤</div>
              <div>
                <div class="user-menu-name" id="user-menu-name"></div>
                <div class="user-menu-sub">已登录</div>
              </div>
            </div>
            <div class="user-menu-item" data-action="profile">🪪 个人主页</div>
            <div class="user-menu-item" data-action="switch">🔄 切换账号</div>
            <div class="user-menu-sep"></div>
            <div class="user-menu-item danger" data-action="logout">⏻ 退出登录</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ============ 主区 ============ -->
    <main class="main">
      <header class="chat-header">
        <div class="chat-title-block">
          <h2 id="chat-title">新会话</h2>
          <span class="subtitle">Supervisor 模式 · 自动路由到 RAG / 搜索 / MCP Agent</span>
        </div>
        <div class="controls">
          <button class="btn btn-ghost" id="btn-stats" title="会话数据分析">用量分析</button>
          <button class="btn btn-ghost" id="btn-tasks" title="定时/批处理任务">定时任务</button>
          <button class="btn btn-ghost" id="btn-timetravel" title="版本历史（Time Travel）：查看并回退到历史步骤重新生成">⏪ 版本历史</button>
          <button class="btn btn-ghost" id="btn-export" title="导出会话为 Markdown">导出</button>
          <span class="controls-divider" aria-hidden="true"></span>
          <label class="switch" title="启用/关闭知识库检索">
            <input type="checkbox" id="rag-toggle" checked />
            <span class="slider"></span>
            <span class="switch-label">知识库</span>
          </label>
          <label class="switch" title="启用/关闭联网搜索">
            <input type="checkbox" id="search-toggle" checked />
            <span class="slider"></span>
            <span class="switch-label">联网搜索</span>
          </label>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <footer class="input-bar">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
        <button class="btn btn-send" id="btn-send" title="发送" aria-label="发送" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
        <button class="btn btn-send btn-stop" id="btn-stop" hidden title="停止生成" aria-label="停止生成">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </footer>
    </main>
  </div>

  <!-- 文档详情弹窗 -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <span id="modal-title">文档详情</span>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- 登录 / 注册弹窗 -->
  <div class="modal-backdrop" id="auth-modal" hidden>
    <div class="modal modal-sm">
      <div class="modal-header">
        <span>账户</span>
        <button class="modal-close" id="auth-close">×</button>
      </div>
      <div class="modal-body">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" data-tab="login">登录</button>
          <button class="auth-tab" id="tab-register" data-tab="register">注册</button>
        </div>
        <form id="auth-form" class="auth-form">
          <label>用户名
            <input id="auth-username" autocomplete="username" required minlength="2" maxlength="32" placeholder="字母/数字/._-" />
          </label>
          <label>密码
            <input id="auth-password" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位" />
          </label>
          <div class="auth-err" id="auth-err" hidden></div>
          <button type="submit" class="btn btn-primary btn-block" id="auth-submit">登录</button>
          <div class="auth-guest"><button type="button" class="btn btn-ghost" id="btn-guest">以访客身份继续</button></div>
        </form>
      </div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
