name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: "Install dependencies"
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: "Ruff lint (errors only: F - undefined / unused)"
        run: ruff check backend/app --select F

      # Pyright 类型检查：报告但不阻塞（项目含大量第三方库类型噪音，
      # 见 docs/EXPLAIN.md；待 langchain 1.x 升级后收紧）
      - name: "Type check (Pyright, non-blocking)"
        run: pyright backend/app
        continue-on-error: true

      # 单元测试：纯逻辑，不依赖 Postgres/Milvus/LLM。
      # 集成测试（tests/integration）需 Docker 依赖，由 rag-regression job 跑。
      - name: "Unit tests (no external services)"
        run: pytest backend/tests/unit -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Type check (vue-tsc)"
        run: npm run typecheck

      - name: "Unit tests (Vitest)"
        run: npm run test -- --run

  # RAG 检索回归：真实启动 Postgres + Milvus，摄入固定测试文档，
  # 断言检索命中率不低于阈值，防止改检索代码/参数导致质量退化。
  rag-regression:
    name: RAG Retrieval Regression
    runs-on: ubuntu-latest
    env:
      # CI 中关闭 rerank（避免下载 ~1.1GB 模型），只验证混合检索召回
      RAG_RERANK_ENABLED: "false"
      # 允许从 HF 下载 bge-small-zh-v1.5（~100MB，首次拉取）
      HF_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: "Install dependencies"
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: "Start Postgres + Milvus"
        run: docker compose up -d postgres etcd minio standalone

      - name: "Wait for Milvus healthy"
        run: |
          for i in $(seq 1 90); do
            if docker compose ps --status running --format '{{.Service}} {{.Health}}' | grep -q 'standalone healthy'; then
              echo "Milvus healthy"; break
            fi
            sleep 5
          done
          docker compose ps

      - name: "Init DB + ingest fixture"
        working-directory: backend
        run: |
          python scripts/init_db.py
          python -c "from pathlib import Path; from app.rag.ingestion import ingest_file; print(ingest_file(Path('tests/fixtures/kb_ci.txt'), user_id='default'))"

      - name: "Retrieval regression (hit-rate threshold)"
        working-directory: backend
        run: pytest tests/integration/test_rag_regression.py -q

      - name: "Retrieval regression (full GT MRR, non-blocking)"
        working-directory: backend
        continue-on-error: true
        run: |
          # 暂用 CI fixture 作为 GT 真值（轻量、无需外部数据）；验混合检索召回防退化。
          python -c "import json, pathlib; p=pathlib.Path('tests/fixtures/rag_ground_truth.example.json'); d=json.loads(p.read_text(encoding='utf-8')); print('GT cases:', len(d))"
          python scripts/eval_rag.py --dataset tests/fixtures/rag_ground_truth.example.json

      - name: "GT v2 (图片/图文/表格/去重/口语) 加载校验"
        working-directory: backend
        continue-on-error: true
        run: |
          # v2 覆盖当前设计：图片/图文双通道、表格/多栏、文档级去重、口语改写。
          python -c "from app.evaluation.dataset import load_ground_truth; cs=load_ground_truth('tests/fixtures/rag_ground_truth.v2.json'); ims=[c for c in cs if c.expected_images]; print('v2 cases:', len(cs), 'with-image:', len(ims)); assert len(cs)==8 and ims"
          python scripts/eval_rag.py --dataset tests/fixtures/rag_ground_truth.v2.json

