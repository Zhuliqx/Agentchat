name: CI

on:
  push:
  pull_request:
  # 手动触发（gh workflow run CI）：不等定时、也不用为触发而特意推提交
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"  # 每天 03:17 UTC 全量回归（含 LLM-judge 质量评估）

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: "Install dependencies"
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: "Ruff lint (F - undefined/unused, E7/E9 - syntax/logic)"
        run: ruff check backend/app --select F,E7,E9

      - name: "Docs stale-symbol check"
        working-directory: backend
        run: python scripts/check_docs_stale.py

      - name: "Docs numbers consistency check"
        working-directory: backend
        run: python scripts/check_docs_numbers.py

      # Pyright 类型检查：报告但不阻塞（项目含大量第三方库类型噪音，
      # 见 docs/EXPLAIN.md；待 langchain 1.x 升级后收紧）
      - name: "Type check (Pyright, non-blocking)"
        run: pyright backend/app || true

      # 单元测试：纯逻辑，不依赖 Postgres/Milvus/LLM。
      # 集成测试（tests/integration）需 Docker 依赖，由 rag-regression job 跑。
      - name: "Unit tests (no external services)"
        run: pytest backend/tests/unit -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Lint (ESLint)"
        run: npm run lint

      - name: "Format check (Prettier)"
        run: npm run format:check

      - name: "Type check (vue-tsc)"
        run: npm run typecheck

      - name: "Unit tests (Vitest)"
        run: npm run test -- --run

      # 前端 E2E 冒烟：接口全部 route mock，不需要后端/LLM
      - name: "Install Playwright browser (chromium)"
        run: npx playwright install --with-deps chromium

      - name: "E2E smoke (Playwright)"
        run: npm run e2e

  # RAG 检索回归：真实启动 Postgres + Milvus，摄入固定测试文档，
  # 断言检索命中率不低于阈值，防止改检索代码/参数导致质量退化。
  rag-regression:
    name: RAG Retrieval Regression
    runs-on: ubuntu-latest
    env:
      # CI 中关闭 rerank（避免下载 ~1.1GB 模型），只验证混合检索召回
      RERANK_ENABLED: "false"
      # 允许从 HF 下载 bge-small-zh-v1.5（~100MB，首次拉取）
      HF_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: "Install dependencies"
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: "Start Postgres + Milvus"
        run: docker compose up -d postgres etcd minio standalone

      - name: "Wait for Milvus healthy"
        run: |
          for i in $(seq 1 90); do
            if docker compose ps --status running --format '{{.Service}} {{.Health}}' | grep -q 'standalone healthy'; then
              echo "Milvus healthy"; break
            fi
            sleep 5
          done
          docker compose ps

      - name: "Init DB + ingest fixture"
        working-directory: backend
        run: |
          python scripts/init_db.py
          python -c "from pathlib import Path; from app.rag.ingestion import ingest_file; print(ingest_file(Path('tests/fixtures/kb_ci.txt'), user_id='default'))"

      - name: "Alembic drift check"
        working-directory: backend
        run: alembic check

      - name: "Retrieval regression (hit-rate threshold)"
        working-directory: backend
        run: pytest tests/integration/test_rag_regression.py -q

      - name: "Retrieval baseline on example corpus (non-blocking)"
        working-directory: backend
        continue-on-error: true
        run: |
          # 评估集 data/eval/ground_truth.json 的 expected_sources 指向示例语料 data/kb（5 篇），
          # 必须喂同一套语料才有意义；用独立 user 与上面的 kb_ci.txt 隔离，避免互相抢召回。
          python scripts/ingest_docs.py ../data/kb --user evalexample
          python scripts/eval_rag.py --dataset ../data/eval/ground_truth.json --user evalexample

      - name: "GT v2 加载校验（私有语料，仅校验可加载）"
        working-directory: backend
        continue-on-error: true
        run: |
          # v2 用例的 expected_sources 指向未入库的私有文档（docs/annual_report_2023.md 等），
          # 所以这里只校验"能加载 + 含图片用例"，不跑检索（跑了也全是 0，没有参考价值）。
          python -c "from app.evaluation.dataset import load_ground_truth; cs=load_ground_truth('tests/fixtures/eval/private_docs_v2.json'); ims=[c for c in cs if c.expected_images]; print('v2 cases:', len(cs), 'with-image:', len(ims)); assert len(cs)==8 and ims"

  # 端到端质量评估（LLM-judge 四指标，需 DEEPSEEK_API_KEY）：
  # 补 §15.2 自述的"四指标无自动化闭环"差距。push + nightly 运行，
  # continue-on-error 不阻塞主 CI；--max-cases 限缩 LLM 成本。
  rag-quality:
    name: RAG Quality (LLM-judge)
    runs-on: ubuntu-latest
    env:
      RERANK_ENABLED: "false"
      HF_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: "Install dependencies"
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: "Start Postgres + Milvus"
        run: docker compose up -d postgres etcd minio standalone

      - name: "Wait for Milvus healthy"
        run: |
          for i in $(seq 1 90); do
            if docker compose ps --status running --format '{{.Service}} {{.Health}}' | grep -q 'standalone healthy'; then
              echo "Milvus healthy"; break
            fi
            sleep 5
          done
          docker compose ps

      - name: "Init DB + ingest example corpus"
        working-directory: backend
        run: |
          python scripts/init_db.py
          # 质量评估的 GT（data/eval/ground_truth.json）以 data/kb 的 5 篇文档为出处，
          # 必须喂同一套语料，否则 expected_sources 全不匹配、context_recall 恒为 0。
          python scripts/ingest_docs.py ../data/kb --user default

      - name: "Quality eval (LLM-judge, max 10 cases, non-blocking)"
        continue-on-error: true
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # CI 未配置 DEEPSEEK_API_KEY 时跳过；配置后运行 LLM-judge 质量评估
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not set; skipping quality eval"
            exit 0
          fi
          python scripts/eval_quality.py --dataset ../data/eval/ground_truth.json --max-cases 10 --out data/eval_runs/ci_quality.json --report

      - name: "Upload quality report"
        if: always() && hashFiles('backend/data/eval_runs/ci_quality*') != ''
        uses: actions/upload-artifact@v5
        with:
          name: rag-quality-report
          path: backend/data/eval_runs/ci_quality*

  # 容器代码沙箱：构建 runner 镜像后验证网络/文件系统/资源边界
  code-runner:
    name: Code Runner (container sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Build runner image"
        run: |
          docker build -t agentchat-code-runner \
            -f backend/docker/code-runner/Dockerfile backend/docker/code-runner

      - name: "Runner sandbox tests"
        run: |
          # 只装这个 job 需要的：pytest + app.config 的依赖（测试会 import app.*）
          pip install pytest pydantic-settings
          pytest backend/tests/integration/test_code_runner.py -q
